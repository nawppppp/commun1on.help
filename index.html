<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c0d0f">
<title>secret santa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0d0f; --panel:#131519; --line:#24272d; --text:#e8e5df; --mute:#868b94;
  --berry:#7d2f3c; --pine:#2d5344; --accent:#ffffff;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{
  min-height:100vh;min-height:100dvh;color:var(--text);font:400 16px/1.55 var(--sans);
  background:
    radial-gradient(600px 400px at 0% 0%,rgba(125,47,60,.13),transparent 70%),
    radial-gradient(600px 400px at 100% 100%,rgba(45,83,68,.14),transparent 70%),
    var(--bg);
  background-attachment:fixed;
  padding-bottom:env(safe-area-inset-bottom);
}
header{
  position:sticky;top:0;z-index:5;background:rgba(12,13,15,.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top)) 20px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,var(--berry),transparent 40%,transparent 60%,var(--pine));opacity:.8}
.brand{font:400 24px/1 var(--serif);letter-spacing:.2px}
.nav{display:flex;gap:8px}
button,.btn{
  font:500 14px/1 var(--sans);color:var(--text);background:transparent;border:1px solid var(--line);
  padding:11px 16px;border-radius:6px;cursor:pointer;transition:border-color .15s,background .15s;
}
button:hover{border-color:#4a4f58;background:rgba(255,255,255,.03)}
button.primary{background:var(--text);color:#0c0d0f;border-color:var(--text)}
button.primary:hover{background:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid #9aa0a9;outline-offset:2px}
main{max-width:680px;margin:0 auto;padding:40px 20px 80px}
h1{font:400 clamp(40px,9vw,64px)/1.05 var(--serif);letter-spacing:-.5px}
h2{font:400 clamp(26px,5vw,34px)/1.15 var(--serif)}
.mute{color:var(--mute)}
.small{font-size:14px}
.stack>*+*{margin-top:16px}
.center{text-align:center}
.overlay{
  position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:28px;padding:24px;text-align:center;
  background:
    radial-gradient(700px 500px at 15% 10%,rgba(125,47,60,.18),transparent 70%),
    radial-gradient(700px 500px at 85% 90%,rgba(45,83,68,.2),transparent 70%),
    var(--bg);
}
.count{font:400 clamp(54px,16vw,120px)/1 var(--serif);letter-spacing:-1px}
.count span{color:var(--mute);font-size:.3em;margin:0 .6em 0 .15em;letter-spacing:0}
label{display:block;font-size:14px;color:var(--mute);margin-bottom:6px}
input,textarea{
  width:100%;font:400 16px/1.4 var(--sans);color:var(--text);background:var(--bg);
  border:1px solid var(--line);border-radius:6px;padding:12px 14px;
}
input::placeholder,textarea::placeholder{color:#555a62}
textarea{resize:vertical;min-height:84px}
.code{font-size:20px;letter-spacing:2px;text-align:center}
.err{color:#c9737f;font-size:14px;min-height:20px}
.panel{border:1px solid var(--line);border-top:2px solid var(--accent);background:var(--panel);border-radius:8px;padding:24px}
.panel h2{margin-bottom:4px}
.gift{padding:20px 0;border-top:1px solid var(--line)}
.gift:first-of-type{border-top:0;padding-top:12px}
.gift .row{display:flex;justify-content:space-between;gap:16px;align-items:baseline}
.gift h3{font:500 18px/1.3 var(--sans);color:var(--accent)}
.gift .price{white-space:nowrap;color:var(--mute)}
.gift p{margin:6px 0 10px;color:#c4c1ba;overflow-wrap:anywhere}
.gift a{color:var(--text);font-size:14px;text-underline-offset:3px;text-decoration-color:var(--accent)}
.card{border:1px solid var(--line);border-radius:8px;padding:20px;background:var(--panel)}
.fields{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:600px){.fields{grid-template-columns:2fr 1fr}.fields .full{grid-column:1/-1}}
.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:32px;height:32px;border-radius:50%;border:1px solid #3a3e46;padding:0;cursor:pointer}
.sw.on{outline:2px solid var(--text);outline-offset:2px}
input[type=color]{width:44px;height:32px;padding:2px;border-radius:6px;cursor:pointer}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border:1px dashed #3a3e46;border-radius:8px}
@media(max-width:480px){header{padding-left:14px;padding-right:14px}button,.btn{padding:10px 12px}}
@media(prefers-reduced-motion:no-preference){.overlay{animation:in .5s ease both}@keyframes in{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>
<header><div class="brand">secret santa</div><div class="nav" id="nav"></div></header>
<main id="app"></main>
<div id="overlay"></div>

<script>
const $ = (s) => document.querySelector(s);
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const api = (action, data = {}) =>
  fetch('/api/app', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, ...data }) })
    .then(async (r) => ({ ok: r.ok, d: await r.json().catch(() => ({})) }))
    .catch(() => ({ ok: false, d: { error: 'could not reach the server.' } }));

const app = $('#app');
let me = null, draft = null;
const SWATCHES = ['#ffffff', '#c0485a', '#4f8a6e', '#d9b36b', '#6f9bd1', '#a98bd6'];
const render = (...n) => { app.replaceChildren(...n); window.scrollTo(0, 0); };

function setNav(on) {
  $('#nav').replaceChildren(...(on ? [
    h('button', { onclick: openEdit }, 'my wishlist'),
    h('button', { onclick: signOut }, 'sign out'),
  ] : []));
}
async function signOut() { await api('logout'); me = null; draft = null; setNav(false); showLogin(); }

/* countdown */
function countdown() {
  const ms = new Date(2026, 11, 18) - new Date();
  const ov = $('#overlay');
  const body = ms <= 0
    ? h('div', { class: 'count' }, 'today')
    : h('div', { class: 'count' }, Math.floor(ms / 864e5), h('span', {}, 'days'), Math.floor((ms % 864e5) / 36e5), h('span', {}, 'hours'));
  ov.append(h('div', { class: 'overlay' },
    h('p', { class: 'mute' }, ms <= 0 ? 'the meetup is december 18, 2026' : 'until the meetup on december 18, 2026'),
    body,
    h('button', { class: 'primary', onclick: () => { ov.replaceChildren(); afterCountdown(); } }, 'ok')));
}

/* session */
let sessionP;
function startSession() {
  const first = !sessionStorage.getItem('seen');
  sessionStorage.setItem('seen', '1');
  sessionP = api('session', { notify: first });
}
async function afterCountdown() {
  const r = await sessionP;
  if (r.ok && r.d.user) {
    me = r.d.user;
    render(h('div', { class: 'stack center', style: 'padding-top:12vh' },
      h('h2', {}, 'you are still logged in.'),
      h('p', { class: 'mute' }, 'do you want to look at your wishlist dashboard?'),
      h('div', { class: 'actions', style: 'justify-content:center;padding-top:8px' },
        h('button', { class: 'primary', onclick: showDash }, 'yes'),
        h('button', { onclick: signOut }, 'no'))));
  } else showLogin();
}

/* login */
function showLogin() {
  setNav(false);
  const input = h('input', { class: 'code', placeholder: 'xxxx-xxxx-xxxx', autocomplete: 'off', autocapitalize: 'none', spellcheck: 'false', maxlength: '20', 'aria-label': 'login code' });
  const err = h('div', { class: 'err', role: 'alert' });
  const btn = h('button', { class: 'primary', style: 'width:100%' }, 'continue');
  const go = async () => {
    if (!input.value.trim()) return;
    btn.disabled = true; err.textContent = '';
    const r = await api('login', { code: input.value });
    btn.disabled = false;
    if (r.ok) { me = r.d; showDash(); } else err.textContent = r.d.error || 'something went wrong.';
  };
  btn.onclick = go;
  input.addEventListener('keydown', (e) => e.key === 'Enter' && go());
  render(h('div', { class: 'stack', style: 'max-width:380px;margin:0 auto;padding-top:10vh' },
    h('h1', {}, 'enter your code'),
    h('p', { class: 'mute' }, 'you were given a personal code. it only works for you.'),
    input, err, btn));
  input.focus();
}

/* shared panel: used by the dashboard and the preview so they always match */
function giftsPanel(name, data) {
  const gifts = data.gifts || [];
  return h('section', { class: 'panel', style: `--accent:${data.color || '#ffffff'}` },
    h('h2', {}, `${name}'s wishlist`),
    gifts.length
      ? gifts.map((g) => h('div', { class: 'gift' },
          h('div', { class: 'row' }, h('h3', {}, g.name), h('span', { class: 'price' }, g.price)),
          h('p', {}, g.description),
          h('a', { href: g.link, target: '_blank', rel: 'noopener noreferrer' }, 'view link')))
      : h('p', { class: 'mute', style: 'padding-top:12px' }, `${name} has not added any gifts yet. check back later.`));
}
function giftingBlock(name, data) {
  return h('div', { class: 'stack' },
    h('p', { class: 'mute' }, 'you are gifting for'),
    h('h1', {}, name),
    giftsPanel(name, data));
}

/* dashboard */
function showDash() {
  setNav(true);
  render(h('div', { class: 'stack', style: 'display:grid;gap:44px' },
    h('div', {}, h('p', { class: 'mute' }, 'signed in as'), h('h2', {}, me.name)),
    giftingBlock(me.target, me.theirs)));
}

/* editor */
function openEdit() {
  draft = JSON.parse(JSON.stringify(me.mine));
  if (!draft.gifts.length) draft.gifts.push(blank());
  showEdit();
}
const blank = () => ({ name: '', description: '', price: '', link: '' });
function sync() {
  document.querySelectorAll('[data-i]').forEach((el) => { draft.gifts[+el.dataset.i][el.dataset.k] = el.value; });
}
function valid() {
  for (const g of draft.gifts) if (!g.name.trim() || !g.description.trim() || !g.price.trim() || !/^https?:\/\/\S+$/i.test(g.link.trim())) return false;
  return true;
}
function showEdit(msg = '') {
  const field = (i, k, label, type = 'input', ph = '', cls = '') => {
    const el = h(type, { 'data-i': i, 'data-k': k, placeholder: ph, id: `f${i}${k}`, maxlength: { name: 80, description: 300, price: 20, link: 500 }[k], autocomplete: 'off' });
    el.value = draft.gifts[i][k];
    return h('div', { class: cls }, h('label', { for: `f${i}${k}` }, label), el);
  };
  const cards = draft.gifts.map((g, i) => h('div', { class: 'card' },
    h('div', { class: 'cardhead' }, h('h3', { style: 'font-weight:500' }, `gift ${i + 1}`),
      draft.gifts.length > 1 ? h('button', { onclick: () => { sync(); draft.gifts.splice(i, 1); showEdit(); } }, 'remove') : null),
    h('div', { class: 'fields' },
      field(i, 'name', 'name of gift'),
      field(i, 'price', 'price', 'input', '$25'),
      field(i, 'description', 'description', 'textarea', '', 'full'),
      field(i, 'link', 'link', 'input', 'https://', 'full'))));
  const colorIn = h('input', { type: 'color', value: draft.color, 'aria-label': 'custom color', onchange: (e) => { sync(); draft.color = e.target.value; showEdit(); } });
  const sw = h('div', { class: 'swatches' }, SWATCHES.map((c) =>
    h('button', { class: 'sw' + (draft.color === c ? ' on' : ''), style: `background:${c}`, 'aria-label': 'accent ' + c, onclick: () => { sync(); draft.color = c; showEdit(); } })), colorIn);
  const err = h('div', { class: 'err', role: 'alert' }, msg);
  render(h('div', { style: 'display:grid;gap:28px' },
    h('div', {}, h('h1', {}, 'my wishlist'), h('p', { class: 'mute' }, 'up to 5 gifts. every field is required.')),
    cards,
    draft.gifts.length < 5 ? h('button', { onclick: () => { sync(); draft.gifts.push(blank()); showEdit(); } }, 'add gift') : null,
    h('div', {}, h('label', {}, 'accent color for your page'), sw),
    err,
    h('div', { class: 'actions' },
      h('button', { onclick: () => { sync(); valid() ? showPreview() : showEdit('fill out every field, and start the link with http.'); } }, 'preview'),
      h('button', { class: 'primary', id: 'save', onclick: save }, 'save wishlist'),
      h('button', { onclick: showDash }, 'back'))));
}
async function save() {
  sync();
  if (!valid()) return showEdit('fill out every field, and start the link with http.');
  $('#save').disabled = true;
  const clean = { color: draft.color, gifts: draft.gifts.map((g) => ({ name: g.name.trim(), description: g.description.trim(), price: g.price.trim(), link: g.link.trim() })) };
  const r = await api('save', { data: clean });
  if (r.ok) { me.mine = r.d.mine; showDash(); } else showEdit(r.d.error || 'could not save. try again.');
}
function showPreview() {
  render(h('div', { style: 'display:grid;gap:28px' },
    h('div', { class: 'bar' }, h('span', { class: 'mute small' }, 'preview of what your gift giver sees'),
      h('button', { onclick: () => showEdit() }, 'back to editing')),
    giftingBlock(me.name, draft)));
}

startSession();
countdown();
</script>
</body>
</html>
